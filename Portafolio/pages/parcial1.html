<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parcial 1 - Portafolio Académico</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles/main.css">
    <link rel="stylesheet" href="../styles/futuristic.css">
    <style>
        .tareas-lista {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 1.5rem;
            margin: 2rem 0;
        }
        
        .tarea-item {
            background: rgba(10, 14, 39, 0.7);
            border: 1px solid rgba(0, 212, 255, 0.2);
            border-radius: 12px;
            padding: 1.5rem;
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        
        .tarea-item:hover {
            border-color: var(--color-primary);
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 212, 255, 0.15);
        }
        
        .tarea-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--color-primary), var(--color-accent));
        }
        
        .tarea-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }
        
        .tarea-fecha {
            color: var(--color-text-secondary);
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .tarea-titulo {
            font-size: 1.3rem;
            font-weight: 600;
            color: var(--color-text-primary);
            margin-bottom: 0.5rem;
        }
        
        .tarea-desc {
            color: var(--color-text-secondary);
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 1rem;
        }
        
        .tarea-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 1rem;
            border-top: 1px solid rgba(0, 212, 255, 0.1);
        }
        
        .tarea-estado {
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
        }
        
        .estado-completado {
            background: rgba(56, 161, 105, 0.2);
            color: #38a169;
            border: 1px solid rgba(56, 161, 105, 0.3);
        }
        
        .estado-progreso {
            background: rgba(214, 158, 46, 0.2);
            color: #d69e2e;
            border: 1px solid rgba(214, 158, 46, 0.3);
        }
        
        .ver-detalles {
            color: var(--color-primary);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }
        
        .ver-detalles:hover {
            text-decoration: underline;
        }
        
        .agregar-tarea-btn {
            background: linear-gradient(45deg, var(--color-primary), var(--color-accent));
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin: 2rem 0;
            transition: all 0.3s ease;
        }
        
        .agregar-tarea-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 212, 255, 0.3);
        }
        
        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        
        .modal-contenido {
            background: rgba(10, 14, 39, 0.95);
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 12px;
            padding: 2rem;
            width: 90%;
            max-width: 500px;
            backdrop-filter: blur(10px);
        }
        
        .modal-titulo {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--color-text-primary);
            margin-bottom: 1.5rem;
            text-align: center;
        }
        
        .form-grupo {
            margin-bottom: 1.5rem;
        }
        
        .form-grupo label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--color-text-secondary);
            font-weight: 500;
        }
        
        .form-grupo input,
        .form-grupo textarea,
        .form-grupo select {
            width: 100%;
            padding: 0.8rem;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(0, 212, 255, 0.2);
            border-radius: 6px;
            color: var(--color-text-primary);
            font-family: 'Inter', sans-serif;
        }
        
        .form-grupo textarea {
            min-height: 100px;
            resize: vertical;
        }
        
        .modal-acciones {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
        }
        
        .btn {
            flex: 1;
            padding: 0.8rem;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.3s ease;
        }
        
        .btn-primario {
            background: var(--color-primary);
            color: white;
        }
        
        .btn-secundario {
            background: rgba(255, 255, 255, 0.1);
            color: var(--color-text-primary);
        }
        
        .btn:hover {
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <!-- HEADER - Navegación fija (consistente con el resto del portafolio) -->
    <header class="main-header">
        <div class="container">
            <div class="logo">
                <span class="logo-icon">◈</span>
                <span class="logo-text">EUGENIO ESPELETA</span>
            </div>
            <nav class="main-nav">
                <a href="../index.html" class="nav-link">Inicio</a>
                <a href="parcial1.html" class="nav-link active">Parcial 1</a>
                <a href="parcial2.html" class="nav-link">Parcial 2</a>
                <a href="parcial3.html" class="nav-link">Parcial 3</a>
                <a href="proyecto.html" class="nav-link">Proyecto</a>
                <a href="hobbies.html" class="nav-link">Hobbies</a>
            </nav>
            <!-- Botón hamburguesa para móvil -->
            <button class="menu-toggle" id="menuToggle">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="main-content">
        <div class="container">
            <header class="page-header">
                <h1>📚 Parcial 1</h1>
                <p>Tareas y actividades del primer parcial</p>
            </header>

            <!-- LISTA DE TAREAS -->
            <div class="tareas-lista" id="listaTareas">
                <!-- Las tareas se cargan automáticamente desde JSON -->
            </div>

            <!-- MENSAJE CUANDO NO HAY TAREAS -->
            <div id="sinTareas" style="text-align: center; padding: 3rem; color: var(--color-text-secondary);">
                <div style="font-size: 3rem; margin-bottom: 1rem;">📭</div>
                <h3>No hay tareas aún</h3>
                <p>Las tareas se cargarán desde el archivo JSON</p>
            </div>
        </div>
    </main>

    <script>
        // VARIABLES GLOBALES
        const TAREAS_KEY = 'parcial1_tareas';
        const TAREAS_JSON_URL = '../data/parcial1/tareas.json';
        const TAREAS_FALLBACK = [
            { id: 1, titulo: 'Configuración de Ubiquitous y Google Cloud', fecha: '2026-01-20', descripcion: 'Configuración inicial del servidor Ubiquitous y creación de máquina virtual en Google Cloud', estado: 'completado', archivo: 'tarea1/tarea1.html' },
            { id: 2, titulo: 'DBMS en máquina virtual de Google Cloud', fecha: '2026-01-23', descripcion: 'Configurar MariaDB en la VM, crear usuarios y realizar respaldos', estado: 'completado', archivo: 'tarea2/tarea2.html' },
            { id: 3, titulo: 'PostgreSQL en máquina virtual de Google Cloud', fecha: '2026-01-27', descripcion: 'Instalación y configuración de PostgreSQL en la VM, creación de tablas relacionales', estado: 'completado', archivo: 'tarea3/tarea3.html' },
            { id: 4, titulo: 'Importación de Bases de Datos Externas', fecha: '2026-02-03', descripcion: 'Descarga e importación de archivos SQL desde fuentes externas, validación de integridad de datos', estado: 'completado', archivo: 'tarea4/tarea4.html' },
            { id: 5, titulo: 'Respaldos de Bases de Datos: MariaDB y PostgreSQL', fecha: '2026-02-10', descripcion: 'Implementación de respaldos lógicos con mysqldump y pg_dumpall; organización y gestión de permisos.', estado: 'completado', archivo: 'tarea5/tarea5.html' },
            { id: 6, titulo: 'Consultas y Stored Procedures en MariaDB (Biblioteca)', fecha: '2026-02-23', descripcion: 'Consultas de inspección y CONCAT; verificación, diagnóstico de error 1064 y eliminación de un stored procedure.', estado: 'completado', archivo: 'tarea6/tarea6.html' },
            { id: 7, titulo: 'Índices, EXPLAIN y Stored Procedures en MariaDB', fecha: '2026-02-13', descripcion: 'Optimización con índices, análisis de planes de ejecución y procedimientos almacenados con validación de parámetros.', estado: 'completado', archivo: 'tarea7/tarea7.html' },
            { id: 8, titulo: 'Stored Procedures avanzados + Setup de Flask en Linux', fecha: '2026-02-17', descripcion: 'Procedures con FIND_IN_SET y parámetros OUT, más preparación de entorno Python con pip y Flask.', estado: 'completado', archivo: 'tarea8/tarea8.html' }
        ];
        const TAREA8_OFICIAL = { id: 8, titulo: 'Stored Procedures avanzados + Setup de Flask en Linux', fecha: '2026-02-17', descripcion: 'Procedures con FIND_IN_SET y parámetros OUT, más preparación de entorno Python con pip y Flask.', estado: 'completado', archivo: 'tarea8/tarea8.html' };

        function asegurarTarea8(lista) {
            const tareas = Array.isArray(lista) ? [...lista] : [];
            const existe = tareas.some(t => (t.archivo || '') === TAREA8_OFICIAL.archivo || Number(t.id) === 8);
            if (!existe) tareas.push(TAREA8_OFICIAL);
            return tareas;
        }
        
        // CARGAR TAREAS AL INICIAR
        document.addEventListener('DOMContentLoaded', async function() {
            const tareas = await cargarTareasDesdeJSON();
            cargarTareas(tareas);
        });
        
        // CARGAR TAREAS DESDE JSON
        async function cargarTareasDesdeJSON() {
            try {
                const response = await fetch(TAREAS_JSON_URL);
                if (!response.ok) {
                    console.warn('No se encontró tareas.json, usando fallback:', TAREAS_JSON_URL);
                    const tareasFinales = asegurarTarea8(TAREAS_FALLBACK);
                    guardarTareas(tareasFinales);
                    return tareasFinales;
                }
                
                const datos = await response.json();
                if (datos.parcial1 && datos.parcial1.length > 0) {
                    const tareasFormateadas = datos.parcial1.map(tarea => ({
                        id: tarea.id || Date.now(),
                        titulo: tarea.titulo,
                        fecha: tarea.fecha,
                        descripcion: tarea.descripcion,
                        estado: tarea.estado,
                        archivo: tarea.archivo,
                        secciones: tarea.secciones
                    }));

                    const tareasFinales = asegurarTarea8(tareasFormateadas);
                    guardarTareas(tareasFinales);
                    console.log('✅ Tareas sincronizadas desde JSON:', tareasFinales);
                    return tareasFinales;
                }

                const tareasFinales = asegurarTarea8(TAREAS_FALLBACK);
                guardarTareas(tareasFinales);
                return tareasFinales;
            } catch (error) {
                console.error('Error al cargar tareas.json:', error);
                const tareasFinales = asegurarTarea8(TAREAS_FALLBACK);
                guardarTareas(tareasFinales);
                return tareasFinales;
            }
        }
        
        // CARGAR Y MOSTRAR TAREAS
        function cargarTareas(tareasInput) {
            const tareas = asegurarTarea8(Array.isArray(tareasInput) ? tareasInput : obtenerTareas());
            const contenedor = document.getElementById('listaTareas');
            const sinTareas = document.getElementById('sinTareas');
            
            if (tareas.length === 0) {
                contenedor.innerHTML = '';
                sinTareas.style.display = 'block';
                return;
            }
            
            sinTareas.style.display = 'none';
            contenedor.innerHTML = '';
            
            // Ordenar por ID (mantener orden original)
            tareas.sort((a, b) => a.id - b.id);
            
            tareas.forEach((tarea, index) => {
                const elemento = crearElementoTarea(tarea, index + 1);
                contenedor.appendChild(elemento);
            });
        }
        
        // CREAR ELEMENTO HTML PARA UNA TAREA
        function crearElementoTarea(tarea, numeroTarea) {
            const div = document.createElement('div');
            div.className = 'tarea-item';
            
            const fechaFormateada = new Date(tarea.fecha).toLocaleDateString('es-ES', {
                day: 'numeric',
                month: 'long',
                year: 'numeric'
            });
            
            const estadoClase = tarea.estado === 'completado' ? 'estado-completado' :
                               tarea.estado === 'progreso' ? 'estado-progreso' : '';
            
            const estadoTexto = tarea.estado === 'completado' ? 'Completada' :
                              tarea.estado === 'progreso' ? 'En progreso' : 'Pendiente';
            
            div.innerHTML = `
                <div style="font-size: 0.85rem; color: var(--color-primary); font-weight: 600; margin-bottom: 0.5rem;">Tarea ${numeroTarea}</div>
                <div class="tarea-header">
                    <span class="tarea-fecha">📅 ${fechaFormateada}</span>
                </div>
                <h3 class="tarea-titulo">${tarea.titulo}</h3>
                <p class="tarea-desc">${tarea.descripcion || 'Sin descripción'}</p>
                <div class="tarea-meta">
                    <span class="tarea-estado ${estadoClase}">${estadoTexto}</span>
                    <a href="../tasks/parcial1/${tarea.archivo}" class="ver-detalles">
                        Ver detalles →
                    </a>
                </div>
            `;
            
            return div;
        }
        
        // OBTENER TAREAS DESDE localStorage
        function obtenerTareas() {
            try {
                const datos = localStorage.getItem(TAREAS_KEY);
                return datos ? JSON.parse(datos) : [];
            } catch (error) {
                console.warn('localStorage inválido, usando fallback en memoria');
                return [...TAREAS_FALLBACK];
            }
        }
        
        // GUARDAR TAREAS EN localStorage
        function guardarTareas(tareas) {
            try {
                localStorage.setItem(TAREAS_KEY, JSON.stringify(tareas));
            } catch (error) {
                console.warn('No se pudo guardar en localStorage, continuando en memoria');
            }
        }

    </script>

    <!-- Scripts JavaScript -->
    <script src="../scripts/main.js"></script>
    <script src="../scripts/animations.js"></script>
</body>
</html>
